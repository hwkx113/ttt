        function getRestBaseUrl() {
            const clean = String(SUPABASE_CONFIG.url || '').trim().replace(/\/+$/, '');
            return clean.endsWith('/rest/v1') ? clean : `${clean}/rest/v1`;
        }

        function isCloudEnabled() {
            return Boolean(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
        }

        function setSyncStatus(text) {
            const el = document.getElementById('sync-status-text');
            if (el) el.textContent = text;
        }

        function cloudHeaders(extra = {}) {
            return {
                'apikey': SUPABASE_CONFIG.anonKey,
                'Authorization': `Bearer ${SUPABASE_CONFIG.anonKey}`,
                'Content-Type': 'application/json',
                ...extra
            };
        }

        async function cloudFetchAllPhotos() {
            if (!isCloudEnabled()) return null;
            const endpoint = `${getRestBaseUrl()}/${SUPABASE_CONFIG.table}?select=id,section,caption,date,data_url,created_at&order=created_at.desc`;
            const res = await fetch(endpoint, { headers: cloudHeaders() });
            if (!res.ok) {
                throw new Error(`Supabase GET ${res.status}`);
            }
            const rows = await res.json();
            return (rows || []).map(r => ({
                id: r.id,
                section: r.section,
                caption: r.caption || '',
                date: r.date || '',
                dataUrl: r.data_url,
                createdAt: r.created_at || ''
            }));
        }

        async function cloudUpsertPhotos(photoList) {
            if (!isCloudEnabled() || !photoList.length) return false;
            const endpoint = `${getRestBaseUrl()}/${SUPABASE_CONFIG.table}`;
            const payload = photoList.map(p => ({
                id: p.id,
                section: p.section,
                caption: p.caption || '',
                date: p.date || '',
                data_url: p.dataUrl
            }));
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: cloudHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                throw new Error(`Supabase UPSERT ${res.status}`);
            }
            return true;
        }

        async function cloudDeletePhoto(photoId) {
            if (!isCloudEnabled() || !photoId) return false;
            const endpoint = `${getRestBaseUrl()}/${SUPABASE_CONFIG.table}?id=eq.${encodeURIComponent(photoId)}`;
            const res = await fetch(endpoint, {
                method: 'DELETE',
                headers: cloudHeaders({ 'Prefer': 'return=minimal' })
            });
            if (!res.ok) {
                throw new Error(`Supabase DELETE ${res.status}`);
            }
            return true;
        }

        function generateDocumentCardDataUrl(item) {
            const canvas = document.createElement('canvas');
            canvas.width = 900;
            canvas.height = 1120;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 6;
            ctx.strokeRect(36, 36, canvas.width - 72, canvas.height - 72);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.strokeRect(52, 52, canvas.width - 104, canvas.height - 104);

            ctx.fillStyle = '#eef2ff';
            ctx.fillRect(80, 82, 240, 42);
            ctx.fillStyle = '#4338ca';
            ctx.font = 'bold 20px Inter, Arial, sans-serif';
            ctx.fillText('РАЗДЕЛ: ЗАНЯТИЯ', 102, 110);

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 34px Inter, Arial, sans-serif';
            const titleText = item.previewTitle || item.caption || 'Материал к занятию';
            ctx.fillText(titleText.slice(0, 38), 80, 178);

            if (item.date) {
                ctx.fillStyle = '#64748b';
                ctx.font = '20px Inter, Arial, sans-serif';
                ctx.fillText(`Дата: ${item.date}`, 80, 218);
            }

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(80, 246);
            ctx.lineTo(canvas.width - 80, 246);
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.font = '24px Inter, Arial, sans-serif';
            let yPos = 298;
            const lines = Array.isArray(item.previewLines) ? item.previewLines : [item.caption || ''];

            for (const line of lines) {
                const words = String(line).split(/\s+/);
                let currentLine = '';
                for (const word of words) {
                    const testLine = currentLine ? `${currentLine} ${word}` : word;
                    if (ctx.measureText(testLine).width > canvas.width - 160 && currentLine) {
                        ctx.fillText(currentLine, 80, yPos);
                        currentLine = word;
                        yPos += 36;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) {
                    ctx.fillText(currentLine, 80, yPos);
                    yPos += 44;
                }
            }

            return canvas.toDataURL('image/jpeg', 0.85);
        }

        function resolveBuiltInImage(item) {
            return new Promise((resolve) => {
                const fallbackUrl = generateDocumentCardDataUrl(item);
                if (!item || !item.filePath) {
                    resolve(fallbackUrl);
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const maxDim = 1200;
                        let { width, height } = img;
                        if (width > maxDim || height > maxDim) {
                            if (width >= height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        canvas.width = width || img.naturalWidth;
                        canvas.height = height || img.naturalHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    } catch (_) {
                        resolve(fallbackUrl);
                    }
                };
                img.onerror = () => resolve(fallbackUrl);
                img.src = item.filePath;
            });
        }

        function recompressDataUrl(dataUrl, maxDimension = 900, quality = 0.65) {
            return new Promise((resolve) => {
                if (!dataUrl || !dataUrl.startsWith('data:image')) return resolve(dataUrl);
                const img = new Image();
                img.onload = () => {
                    try {
                        let { width, height } = img;
                        if (width > maxDimension || height > maxDimension) {
                            if (width >= height) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            } else {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    } catch (_) {
                        resolve(dataUrl);
                    }
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        async function getBuiltInClassesPhotos() {
            const resolved = [];
            for (const item of DEFAULT_CLASSES_PHOTOS) {

                resolved.push({

        function openArchiveDB() {
            return new Promise((resolve, reject) => {
                if (dbInstance) return resolve(dbInstance);
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        store.createIndex('section', 'section', { unique: false });
                    }
                };

                request.onsuccess = (event) => {
                    dbInstance = event.target.result;
                    resolve(dbInstance);
                };

                request.onerror = () => reject(request.error || new Error('Ошибка IndexedDB'));
            });
        }

        async function getAllPhotosFromDB() {
            const db = await openArchiveDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        async function putPhotosToDB(photoList) {
            const db = await openArchiveDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                photoList.forEach(photo => store.put(photo));
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function deletePhotoFromDB(id) {
            const db = await openArchiveDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function readFileAsCompressedDataUrl(file, maxDimension = 1000, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            let { width, height } = img;
                            if (width > maxDimension || height > maxDimension) {
                                if (width >= height) {
                                    height = Math.round((height * maxDimension) / width);
                                    width = maxDimension;
                                } else {
                                    width = Math.round((width * maxDimension) / height);
                                    height = maxDimension;
                                }
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        } catch (err) {
                            resolve(e.target.result);
                        }
                    };
                    img.onerror = () => resolve(e.target.result);
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(reader.error || new Error('Ошибка чтения файла'));
                reader.readAsDataURL(file);
            });
        }

        async function ingestPhotoFiles(files, sectionId) {
            const imageFiles = files.filter(f => f.type && f.type.startsWith('image/'));
            if (!imageFiles.length) {
                showToast('Выберите изображения (JPG, PNG, WEBP)', 'error');
                return;
            }

            const todayStr = new Date().toLocaleDateString('ru-RU');
            const created = [];

            for (let i = 0; i < imageFiles.length; i++) {
                const file = imageFiles[i];
                try {
                    const dataUrl = await readFileAsCompressedDataUrl(file);
                    const cleanCaption = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
                    created.push({
                        id: `photo-${sectionId}-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 7)}`,
                        section: sectionId,
                        caption: cleanCaption || 'Новая фотография',
                        date: todayStr,
                        dataUrl
                    });
                } catch (err) {
                    showToast(`Не удалось прочитать файл «${file.name}»`, 'error');
                }
            }

            if (created.length > 0) {
                try {
                    await putPhotosToDB(created);
                    appState.photos = [...created, ...appState.photos];
                    switchSection(sectionId);
                    renderAllSections();

                    if (isCloudEnabled()) {
                        setSyncStatus('Сохраняем в облако...');
                        await cloudUpsertPhotos(created);
                        setSyncStatus('Облако подключено • Все устройства');
                        showToast(`Сохранено и отправлено на все устройства: ${created.length}`);
                    } else {
                        setSyncStatus('Только этот браузер');
                        showToast(`Сохранено в браузере (${created.length})`);
                    }
                } catch (err) {
                    setSyncStatus('Ошибка облака • Сохранено локально');
                    showToast('Сохранено локально, но облако не ответило', 'error');
                }
            }
        }

        function openCaptionModal(photoId) {
            const photo = appState.photos.find(p => p.id === photoId);
            if (!photo) return;
            appState.editingPhotoId = photoId;
            const input = document.getElementById('edit-caption-input');
            input.value = photo.caption || '';
            const modal = document.getElementById('modal-edit-caption');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => input.focus(), 50);
        }

        function closeCaptionModal() {
            appState.editingPhotoId = null;
            const modal = document.getElementById('modal-edit-caption');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function saveCaptionEdit() {
            const photoId = appState.editingPhotoId;
            if (!photoId) return;
            const newCaption = document.getElementById('edit-caption-input').value.trim() || 'Без подписи';
            const photo = appState.photos.find(p => p.id === photoId);
            if (!photo) return;

            photo.caption = newCaption;
            try {
                await putPhotosToDB([photo]);
                if (isCloudEnabled()) {
                    await cloudUpsertPhotos([photo]);
                }
                closeCaptionModal();
                renderAllSections();
                showToast('Подпись обновлена');
            } catch (err) {
                showToast('Не удалось обновить подпись в облаке', 'error');
            }
        }

        async function removePhoto(photoId) {
            try {
                await deletePhotoFromDB(photoId);
                if (isCloudEnabled()) {
                    await cloudDeletePhoto(photoId);
                }
                appState.photos = appState.photos.filter(p => p.id !== photoId);
                renderAllSections();
                showToast('Фото удалено');
            } catch (err) {
                showToast('Ошибка при удалении', 'error');
            }
        }

        function openSectionLightbox(sectionId, indexInFiltered) {
            const query = appState.searchQuery.trim().toLowerCase();
            const list = appState.photos.filter(p => {
                if (p.section !== sectionId) return false;
                if (!query) return true;
                return (p.caption || '').toLowerCase().includes(query);
            });
            if (!list.length) return;

            appState.lightboxPhotos = list;
            appState.lightboxIndex = Math.max(0, Math.min(indexInFiltered, list.length - 1));
            updateLightboxView();

            const lb = document.getElementById('lightbox');
            lb.classList.remove('hidden');
            lb.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('hidden');
            lb.classList.remove('flex');
            document.body.style.overflow = '';
        }

        function stepLightbox(delta) {
            const total = appState.lightboxPhotos.length;
            if (total <= 1) return;
            appState.lightboxIndex = (appState.lightboxIndex + delta + total) % total;
            updateLightboxView();
        }

        function updateLightboxView() {
            const photo = appState.lightboxPhotos[appState.lightboxIndex];
            if (!photo) return;

            const secObj = SECTIONS_CONFIG.find(s => s.id === photo.section);
            document.getElementById('lightbox-img').src = photo.dataUrl;
            document.getElementById('lightbox-caption').textContent = photo.caption || 'Без подписи';
            document.getElementById('lightbox-date').textContent = photo.date || '';
            document.getElementById('lightbox-section-badge').textContent = secObj ? secObj.title : photo.section;
            document.getElementById('lightbox-counter').textContent = `${appState.lightboxIndex + 1} / ${appState.lightboxPhotos.length}`;

            const dlBtn = document.getElementById('lightbox-download');
            dlBtn.href = photo.dataUrl;
            const safeName = (photo.caption || 'photo').replace(/[^a-zа-яё0-9_-]/gi, '_');
            dlBtn.download = `${safeName}.jpg`;

            const hasMultiple = appState.lightboxPhotos.length > 1;
            document.getElementById('lightbox-prev-btn').style.display = hasMultiple ? '' : 'none';
            document.getElementById('lightbox-next-btn').style.display = hasMultiple ? '' : 'none';
        }

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (lb && !lb.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') stepLightbox(-1);
                if (e.key === 'ArrowRight') stepLightbox(1);
            }
        });

        async function exportArchiveJSON() {
            if (!appState.photos.length) {
                showToast('Пока нет фотографий для скачивания', 'error');
                return;
            }
            try {
                showToast('Готовим резервную копию data.json...');
                const optimizedPhotos = [];
                for (const p of appState.photos) {
                    const compactUrl = await recompressDataUrl(p.dataUrl, 850, 0.62);
                    optimizedPhotos.push({ ...p, dataUrl: compactUrl });
                }

                const payload = {
                    app: 'Школьный Фотоархив',
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    photos: optimizedPhotos
                };

                const jsonString = JSON.stringify(payload);
                const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'data.json';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast('Файл data.json скачан');
            } catch (err) {
                showToast('Ошибка при скачивании архива', 'error');
            }
        }

        async function importArchiveJSON(event) {
            const file = event.target.files?.[0];
            event.target.value = '';
            if (!file) return;

            try {
                const text = await file.text();
                const parsed = JSON.parse(text);
                const rawList = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.photos) ? parsed.photos : null);

                if (!rawList) {
                    showToast('Неверный формат файла архива', 'error');
                    return;
                }

                const validSectionIds = new Set(SECTIONS_CONFIG.map(s => s.id));
                const cleaned = rawList
                    .filter(item => item && typeof item.dataUrl === 'string' && item.dataUrl.length > 0)
                    .map((item, idx) => ({
                        id: item.id || `imported-${Date.now()}-${idx}`,
                        section: validSectionIds.has(item.section) ? item.section : 'images',
                        caption: String(item.caption || 'Фотография'),
                        date: String(item.date || new Date().toLocaleDateString('ru-RU')),
                        dataUrl: item.dataUrl
                    }));

                if (!cleaned.length) {
                    showToast('В файле нет фотографий', 'error');
                    return;
                }

                await putPhotosToDB(cleaned);
                if (isCloudEnabled()) {
                    await cloudUpsertPhotos(cleaned);
                }
                appState.photos = await getAllPhotosFromDB();
                renderAllSections();
                showToast(`Загружено фото: ${cleaned.length}`);
            } catch (err) {
                showToast('Не удалось прочитать файл', 'error');
            }
        }

        async function syncFromCloud(showNotify = false) {
            if (!isCloudEnabled()) return;
            try {
                setSyncStatus('Синхронизация...');
                const cloudPhotos = await cloudFetchAllPhotos();
                if (Array.isArray(cloudPhotos)) {
                    await putPhotosToDB(cloudPhotos);
                    const builtIns = await getBuiltInClassesPhotos();
                    const cloudIds = new Set(cloudPhotos.map(p => p.id));
                    const merged = [
                        ...cloudPhotos,
                        ...builtIns.filter(b => !cloudIds.has(b.id))
                    ];
                    appState.photos = merged;
                    renderAllSections();
                    setSyncStatus('Облако подключено • Все устройства');
                    if (showNotify) showToast('Список фото обновлён с других устройств');
                }
            } catch (err) {
                setSyncStatus('Ошибка облака • Проверьте таблицу archive_photos');
                if (showNotify) showToast('Не удалось обновить из облака', 'error');
            }
        }

        function handleSearchChange(val) {
            appState.searchQuery = val || '';
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) clearBtn.classList.toggle('hidden', !appState.searchQuery.trim());
            renderAllSections();
        }

        function clearSearch() {
            const input = document.getElementById('global-search');
            if (input) input.value = '';
            handleSearchChange('');
        }

        function initThemeToggle() {
            const savedTheme = localStorage.getItem('spa_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            document.getElementById('theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('spa_theme', isDark ? 'dark' : 'light');
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const colorClass = type === 'error'
                ? 'bg-rose-600 text-white'
                : 'bg-slate-900 dark:bg-indigo-600 text-white';
            toast.className = `${colorClass} text-xs sm:text-sm font-medium px-4 py-3 rounded-xl shadow-xl transform transition-all duration-300 translate-y-2 opacity-0`;
            toast.textContent = message;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            initThemeToggle();
            buildSectionsDOM();
            switchSection('classes');

            try {
                let stored = await getAllPhotosFromDB();
                const builtIns = await getBuiltInClassesPhotos();
                const existingIds = new Set(stored.map(p => p.id));
                const missingBuiltIns = builtIns.filter(p => !existingIds.has(p.id));
                if (missingBuiltIns.length > 0) {
                    await putPhotosToDB(missingBuiltIns);
                    stored = [...stored, ...missingBuiltIns];
                }
                appState.photos = stored;
            } catch (_) {
                appState.photos = await getBuiltInClassesPhotos();
            }

            renderAllSections();

            if (isCloudEnabled()) {
                setSyncStatus('Облако подключено • Все устройства');
                await syncFromCloud(false);
            }

            lucide.createIcons();
        });
    </script>
</body>
